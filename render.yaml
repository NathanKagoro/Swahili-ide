services:
  - type: web
    name: swahili-voice-ide-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://your-frontend-domain
      - key: OPENROUTER_API_KEY
        sync: false

  - type: static
    name: swahili-voice-ide-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    publishDir: frontend-build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://swahili-voice-ide-backend.onrender.com/api
